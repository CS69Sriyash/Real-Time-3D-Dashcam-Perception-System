[project]
name = "real-time-3d-dashcam-perception-system"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "CS69Sriyash", email = "2201cs69_sriyash@iitp.ac.in" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=0.29.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.26.0,<1.28.0",
    "opencv-python>=4.9.0,<4.12.0",
    "pillow>=10.2.0",
    "scipy==1.11.4",
    "supervision>=0.22.0",
    "timm>=0.9.12",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "tqdm>=4.66.0",
    "transformers==4.40.2",
    "ultralytics>=8.3.0",
]

[project.scripts]
real-time-3d-dashcam-perception-system = "real_time_3d_dashcam_perception_system:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
