[project]
name = "dashcam-perception"
version = "0.1.0"
description = "Real-time 3D dashcam perception: YOLOv8 + Depth Anything V2 + orthographic BEV collision-risk visualization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    # numpy<1.28 paired with opencv-python<4.12 avoids a real conflict:
    # opencv-python>=4.12 requires numpy>=2, which would break this pin.
    "numpy>=1.26.0,<1.28.0",
    "scipy==1.11.4",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "transformers==4.40.2",
    "timm>=0.9.12",
    "accelerate>=0.29.0",
    "ultralytics>=8.3.0",
    "supervision>=0.22.0,<0.31.0",  # ByteTrack removed entirely in 0.31.0 — see requirements.txt note
    "opencv-python>=4.9.0,<4.12.0",
    "pillow>=10.2.0",
    "ffmpeg-python>=0.2.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# CUDA 12.1 PyTorch wheels by default (matches an available NVIDIA GPU,
# e.g. RTX 3050). For a CPU-only machine, override the source or install
# torch/torchvision from the CPU index manually first — see README "Setup".
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
testpaths = ["tests"]